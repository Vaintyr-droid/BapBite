<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Order - Bapbite</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="order-page">

    <div class="app-container">
        <header class="dash-header">
            <div class="header-info">
                <h2>🛒 My Cart</h2>
            </div>
            <button class="icon-btn" onclick="window.location.href='dashboard.html'" title="Back to Dashboard">🔙</button>
        </header>

        <main>
            <div id="cart-container" class="card" style="margin-top: 10px;">
                <ul id="cart-list" class="item-list">
                    </ul>
                
                <div class="cart-total-section">
                    <h3>Total: <span id="cart-total" class="text-green">₱0.00</span></h3>
                </div>

                <button class="action-btn" id="checkout-btn" onclick="processCheckout()" style="margin-top: 15px;">Place Order</button>
            </div>
            
            <p id="order-message" class="message" style="display: none;"></p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
